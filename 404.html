<script>
/* 首屏判定，全部在第一次绘制前完成：
   1. 首页播开场动画 → 藏顶栏与页脚，把卡片预置为「待播」，同时显示静态首屏层
      （满屏底色 + 「你好」），不等 JSON 就能出画面
   2. 带 from=admin（从管理端进入）→ 顶栏直接以六项形态出现，
      由 CSS 控制显隐，不需要等 JS 插入，因此不会先显示四项再补两项
   3. 版本自检触发的重载会带 v= 参数，此轮不再重播「你好」的入场淡入

   注意：所有标记只能加在 documentElement 上，CSS 一律用 html.* 选择器匹配。 */
(function () {
  try {
    var p = location.pathname.replace(/\/+$/, "") || "/";
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (/(^|[?&])from=admin(&|$)/.test(location.search)) {
      document.documentElement.classList.add("from-admin");
    }
    if (/(^|[?&])v=[0-9]{12}(&|$)/.test(location.search)) {
      document.documentElement.classList.add("ver-reload");
    }

    if (p !== "/") return;
    if (location.hash && location.hash !== "#/") return;
    if (reduce) return;

    document.documentElement.classList.add("intro-on", "intro-pending");

    /* 兜底：脚本异常导致时间轴始终没启动时放出页面，避免长时间锁死。
       正常路径下片头会等版本自检完成后自行启动，用不到这个兜底 */
    window.setTimeout(function () {
      var de = document.documentElement;
      if (de.classList.contains("intro-pending") && !document.querySelector(".jelly.is-intro")) {
        de.classList.remove("intro-pending", "intro-on");
      }
    }, 8000);
  } catch (e) {}
})();
</script>
