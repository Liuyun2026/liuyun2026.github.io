<script>
/* 首屏判定，全部在第一次绘制前完成：
   1. 首页首次进入播开场动画 → 藏顶栏与页脚、先隐藏真实 .jelly；
      同步启动器量好尺寸后由 CSS keyframes 直接从铺满视口开始收缩，不等任何 JSON
   2. 带 from=admin（从管理端进入）→ 顶栏直接以六项形态出现，
      由 CSS 控制显隐，不需要等 JS 插入，因此不会先显示四项再补两项
   3. 非首页路径（含 404.html 兜底的深层地址）→ 骨架先隐藏，
      等数据就绪由 render() 一次性换成目标视图，不闪出首页卡片
   4. 版本自检触发的重载带 v= 参数，此轮不进片头状态，卡片保持正常尺寸

   注意：所有标记只能加在 documentElement 上，CSS 一律用 html.* 选择器匹配。 */
(function () {
  try {
    var p = location.pathname.replace(/\/+$/, "") || "/";
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var de = document.documentElement;

    if (/(^|[?&])from=admin(&|$)/.test(location.search)) {
      de.classList.add("from-admin");
    }
    if (/(^|[?&])v=[0-9]{12}(&|$)/.test(location.search)) {
      de.classList.add("ver-reload");
      return;
    }
    if (p !== "/" || (location.hash && location.hash !== "#/")) {
      de.classList.add("boot-hidden");
      return;
    }
    if (reduce) return;

    /* 只加状态，不写放大倍数：启动器量出真实尺寸后一次性写入 CSS 变量并
       立刻启动 animation，首帧就是动画起点，不存在用估算值画出的静止帧 */
    de.classList.add("intro-on", "intro-pending");

    /* 兜底：内联启动器异常时放出页面，避免长时间锁死 */
    window.setTimeout(function () {
      if (!window.__introDone && de.classList.contains("intro-on") &&
          !de.classList.contains("intro-run")) {
        de.classList.remove("intro-pending", "intro-on");
        window.__introDone = true;
        window.dispatchEvent(new Event("intro:done"));
      }
    }, 3200);
  } catch (e) {}
})();
</script>

<!-- 首帧骨架：片头启动器执行时 .jelly 必须已经布局好。
     内容 JSON 在后台并行加载，就绪后由 app.js 补齐下方列表与计数；
     片头期间不重建视图，收尾后 render() 再接管。
     is-boot 只用于非首页路径在等数据期间隐藏骨架，render() 时移除。 -->

<script>
/* 片头启动器：同步内联，不等外部脚本、版本自检或内容 JSON。
   卡片此时由 intro-pending 隐藏但仍占位，先量出真实尺寸写入 CSS 变量，
   再撤掉隐藏并加 intro-run，CSS keyframes 立即从铺满视口开始收缩；
   animationend 统一收尾。全程没有静态插图，也没有第二套放大机制。 */
(function () {
  var de = document.documentElement;
  if (!de.classList.contains("intro-pending")) return;
  var card = document.querySelector("#view .jelly, #admView .jelly");
  if (!card) { de.classList.remove("intro-pending", "intro-on"); return; }

  var r = card.getBoundingClientRect();
  var vw = window.innerWidth, vh = window.innerHeight;
  var s = (r.width && r.height) ? Math.max(vw / r.width, vh / r.height) * 1.04 : 6;
  de.style.setProperty("--intro-scale", s.toFixed(4));
  de.style.setProperty("--intro-dx", (vw / 2 - (r.left + r.width / 2)).toFixed(2) + "px");
  de.style.setProperty("--intro-dy", (vh / 2 - (r.top + r.height / 2)).toFixed(2) + "px");
  de.classList.remove("intro-pending");
  de.classList.add("intro-run");

  var done = false;
  function finish() {
    if (done) return;
    done = true;
    de.classList.remove("intro-on", "intro-run", "intro-pending");
    window.__introDone = true;
    window.dispatchEvent(new Event("intro:done"));
  }
  window.__introFinish = finish;
  card.addEventListener("animationend", function (e) {
    if (e.target === card && e.animationName === "intro-card") finish();
  });
  window.setTimeout(finish, 2600);
})();
</script>
