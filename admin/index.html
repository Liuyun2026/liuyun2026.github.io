<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理端 · 流雲的创客空间</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230B0F16'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='15' font-weight='bold' fill='%237FB2FF' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/css/style.css?v=202611072256">
<link rel="stylesheet" href="/assets/css/admin.css?v=202611072256">
<script>
/* 首屏判定：/admin/ 首次进入时，在第一次绘制前藏好顶栏，
   由 CSS 把 HTML 里已有的真实 .jelly 铺满视口。时间轴由 admin-app.js
   等版本自检完成后接管，避免自检重载导致重播一次。
   /manage/、/theme/ 与版本自检重载页都不进片头状态，卡片保持正常尺寸。
   本脚本位于 head，document.body 尚不存在，标记只加在 documentElement 上。 */
(function () {
  try {
    var p = location.pathname.replace(/\/+$/, "") || "/";
    var de = document.documentElement;
    if (/(^|[?&])v=[0-9]{12}(&|$)/.test(location.search)) {
      de.classList.add("ver-reload");
      return;
    }
    if (p !== "/admin") return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    de.classList.add("intro-on", "intro-pending");

    /* 兜底：脚本异常导致时间轴始终没启动时放出页面，避免长时间锁死 */
    window.setTimeout(function () {
      if (de.classList.contains("intro-pending") && !document.querySelector(".jelly.is-intro")) {
        de.classList.remove("intro-pending", "intro-on");
      }
    }, 8000);
  } catch (e) {}
})();
</script>
<script src="/assets/js/pageflow.js?v=202611072256"></script>
<script>window.__BUILD__="202611072256";</script>
<script src="/assets/js/vercheck.js?v=202611072256"></script>
</head>
<body>

<div class="bg" aria-hidden="true"></div>

<!-- 开场首帧直接使用真实的果冻卡片（见 #admView），由 CSS 在 intro-pending 下铺满视口。 -->
<div class="intro-layer on" id="introLayer" aria-hidden="true">
  <div class="intro-hello show"><span>你</span><span>好</span></div>
  <div class="intro-welcome">欢迎来到<span class="hl">流雲</span>的创客空间</div>
</div>

<!-- 统一顶栏：首页 / 内容 / 壁纸为视图切换（data-adm），项目 / 笔记 / 资料 / 访客站为真实跳转 -->
<header class="nav adm-nav">
  <div class="nav-inner">
    <a class="brand" href="/admin/" data-adm="home">
      <span class="mark">L</span>
      <span class="brand-txt">流雲</span>
    </a>
    <nav class="nav-links">
      <a href="/admin/" data-adm="home">首页</a>
      <a href="/" title="站点">站点</a>
      <a href="/manage/" data-adm="manage">内容</a>
      <a href="/theme/" data-adm="theme">壁纸</a>
    </nav>
    <div class="nav-right">
      <span class="nav-status"><i class="dot"></i><span id="status">未连接</span></span>
      <a class="nav-ico" href="https://github.com/Liuyun2026" target="_blank" rel="noopener" aria-label="GitHub">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A7.995 7.995 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
      <a class="nav-ico" href="/manual/" target="_blank" rel="noopener" aria-label="操作手册">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h9L19 7.5v13H6z"/><path d="M14.5 3.5V8H19"/><path d="M9 12h7M9 15.5h7"/></svg>
      </a>
    </div>
  </div>
</header>

<!-- 视图容器：home / manage / theme 三个视图在此互相替换 -->
<!-- 首帧骨架：/admin/ 播片头时，真实 .jelly 必须在第一次绘制前就存在。
     intro-pending 会把它铺满视口；渲染完成后由 admin-app.js 的 render() 接管。 -->
<main class="adm-view adm-view--home" id="admView">
  <div class="adm-welcome">
    <div class="home">
      <section class="hero-jelly">
        <div class="jelly">
          <span class="jelly-tag">你好</span>
          <h1>欢迎来到<span class="hl">流雲</span>的创客空间<span class="adm-tag">管理端</span></h1>
          <div class="jelly-meta">
            <span class="pill"><i class="dot"></i>管理端</span>
            <a class="pill pill--link" href="/">进入站点 →</a>
          </div>
        </div>
      </section>
      <nav class="bubbles"></nav>
    </div>
  </div>
</main>

<script src="/assets/js/admin-app.js?v=202611072256"></script>
</body>
</html>
