<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理端 · 流雲的创客空间</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230B0F16'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='15' font-weight='bold' fill='%237FB2FF' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>

<div class="bg" aria-hidden="true"></div>

<div class="adm-welcome" id="welcome">
  <div class="home">
    <section class="hero-jelly">
      <div class="jelly">
        <span class="jelly-tag">你好</span>
        <h1>欢迎来到<span class="hl">流雲</span>的创客空间<span class="adm-tag">管理端</span></h1>
        <div class="jelly-meta">
          <span class="pill"><i class="dot"></i>内容管理</span>
          <a class="pill pill--link" href="/">← 返回站点</a>
        </div>
      </div>
    </section>

    <nav class="bubbles">
      <a class="bubble" href="/projects">
        <span class="bubble-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 20.5 7v10L12 21.2 3.5 17V7z"/><path d="M3.5 7 12 11.4 20.5 7M12 11.4V21.2"/></svg></span>
        <span class="bubble-t">项目</span>
        <span class="bubble-e">Projects</span>
      </a>
      <a class="bubble" href="/notes">
        <span class="bubble-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h9L19 7.5v13H6z"/><path d="M14.5 3.5V8H19"/><path d="M9 12h7M9 15.5h7M9 8.5h2.5"/></svg></span>
        <span class="bubble-t">笔记</span>
        <span class="bubble-e">Notes</span>
      </a>
      <a class="bubble" href="/files">
        <span class="bubble-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg></span>
        <span class="bubble-t">资料</span>
        <span class="bubble-e">Files</span>
      </a>
      <a class="bubble" href="/admin/manage.html">
        <span class="bubble-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.2"/><circle cx="9.5" cy="17" r="2.2"/></svg></span>
        <span class="bubble-t">内容</span>
        <span class="bubble-e">Content</span>
      </a>
      <a class="bubble" href="/admin/theme.html">
        <span class="bubble-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M3.5 16.5 9 12l4 3.5 3.5-3 4 4"/></svg></span>
        <span class="bubble-t">壁纸</span>
        <span class="bubble-e">Theme</span>
      </a>
    </nav>
  </div>

  <!-- 开场文字层：独立于卡片，只跟随位移不参与缩放，字号恒定 -->
  <div class="intro-layer">
    <div class="intro-hello"><span>你</span><span>好</span></div>
    <div class="intro-welcome">欢迎来到<span class="hl">流雲</span>的创客空间</div>
  </div>
</div>

<script>
/* 管理端主页：壁纸取 content/theme.json 的 admin 字段 + 开场动画（与访客端同一套） */
(function () {
  "use strict";

  fetch("/content/theme.json?t=" + Date.now()).then(function (r) {
    if (!r.ok) throw new Error("theme");
    return r.json();
  }).then(function (t) {
    var bg = document.querySelector(".bg");
    if (bg && t && t.admin) bg.style.backgroundImage = 'url("' + t.admin + '")';
  }).catch(function () {});

  /* ---------- 开场动画 ----------
   * 时间轴与访客端一致：
   *   0.00s  卡片铺满全屏，「你好」逐字浮现
   *   1.25s  「你好」缩小淡出，欢迎语淡入
   *   2.50s  卡片弹性收缩回原位，文字层反向跟随
   *   3.90s  气泡自下而上依次弹起
   * 片头期间整页锁定，任意点击/触摸/Esc/Enter/空格打断
   */
  var introTimers = [];
  var introRunning = false;

  function introLater(fn, ms) { introTimers.push(window.setTimeout(fn, ms)); }
  function clearIntroTimers() {
    for (var i = 0; i < introTimers.length; i++) window.clearTimeout(introTimers[i]);
    introTimers = [];
  }

  function skipIntro() {
    if (!introRunning) return;
    introRunning = false;
    clearIntroTimers();

    var card = document.querySelector(".jelly");
    var layer = document.querySelector(".intro-layer");

    if (card) {
      card.style.transition = "transform .32s cubic-bezier(.3,1,.4,1), border-radius .28s ease";
      card.style.transform = "";
      card.style.borderRadius = "";
      card.classList.remove("is-intro");
      window.setTimeout(function () { card.style.transition = ""; }, 340);
    }
    if (layer) {
      layer.classList.remove("on");
      layer.style.transition = "none";
      layer.style.transform = "";
    }

    document.body.classList.remove("intro-on");
    document.documentElement.classList.remove("intro-on");
    window.scrollTo(0, 0);
    var bubbles = document.querySelector(".bubbles");
    if (bubbles) bubbles.classList.add("play");
  }

  function playIntro() {
    var card = document.querySelector(".jelly");
    var layer = document.querySelector(".intro-layer");
    if (!card || !layer) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      var bs = document.querySelector(".bubbles");
      if (bs) bs.classList.add("play");
      return;
    }

    var hello = layer.querySelector(".intro-hello");
    var welcome = layer.querySelector(".intro-welcome");
    if (!hello || !welcome) return;

    var r = card.getBoundingClientRect();
    if (!r.width || !r.height) return;

    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.max(vw / r.width, vh / r.height) * 1.02;
    var dx = vw / 2 - (r.left + r.width / 2);
    var dy = vh / 2 - (r.top + r.height / 2);
    var move = "translate3d(" + dx + "px," + dy + "px,0)";

    introRunning = true;
    document.body.classList.add("intro-on");
    document.documentElement.classList.add("intro-on");
    card.classList.add("is-intro");

    /* 圆角不做覆盖，保持 44px，任意缩放倍数下都是气泡形态 */
    card.style.transformOrigin = "50% 50%";
    card.style.transform = move + " scale(" + s + ")";

    layer.style.transform = "translate3d(0,0,0)";
    layer.classList.add("on");

    introLater(function () { hello.classList.add("show"); }, 120);
    introLater(function () { hello.classList.add("out"); }, 1250);
    introLater(function () { welcome.classList.add("in"); }, 1700);

    introLater(function () {
      var ease = "cubic-bezier(.32,.9,.3,1)";
      card.style.transition = "transform 1.35s " + ease;
      card.style.transform = "translate3d(0,0,0) scale(1)";
      layer.style.transition = "transform 1.35s " + ease + ", opacity .55s ease";
      layer.style.transform = "translate3d(" + (-dx) + "px," + (-dy) + "px,0)";
      layer.classList.remove("on");
    }, 2500);

    introLater(function () { card.classList.remove("is-intro"); }, 3750);

    introLater(function () {
      card.style.transition = "none";
      card.style.transform = "";
      layer.style.transition = "none";
      layer.style.transform = "";
      window.setTimeout(function () {
        card.style.transition = "";
        layer.style.transition = "";
      }, 60);
      document.body.classList.remove("intro-on");
      document.documentElement.classList.remove("intro-on");
      var bubbles = document.querySelector(".bubbles");
      if (bubbles) bubbles.classList.add("play");
      introRunning = false;
    }, 3900);
  }

  function introGuard(e) {
    if (!document.body.classList.contains("intro-on")) return;
    if (e.cancelable) e.preventDefault();
    e.stopPropagation();
    skipIntro();
  }
  document.addEventListener("touchstart", introGuard, { capture: true, passive: false });
  document.addEventListener("mousedown", introGuard, true);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" || e.key === "Enter" || e.key === " ") {
      if (document.body.classList.contains("intro-on")) skipIntro();
    }
  }, true);

  window.setTimeout(playIntro, 40);
})();
</script>
</body>
</html>
