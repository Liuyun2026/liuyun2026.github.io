<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<body>

    </a>
    <nav class="nav-links">

      <a href="/projects">项目</a>

      <a href="/admin/manage/">内容</a>
      <a href="/admin/theme/" class="on">壁纸</a>
    </nav>
    <div class="nav-right">
      <span class="nav-status"><i class="dot"></i><span id="status">未连接</span></span>
      <a class="nav-ico" id="navGithub" href="https://github.com/Liuyun2026" target="_blank" rel="noopener" aria-label="GitHub"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A7.995 7.995 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>

      </a>
    </div>
  </div>
</header>

<main class="theme-main">
  <div class="adm-token" id="tokenRow">
    <input id="tokenInput" type="password" placeholder="粘贴令牌" autocomplete="off">
    <button id="tokenSave">连接</button>
  </div>

  <div class="theme-grid">
    <section class="adm-panel theme-card">
      <div class="theme-name">访客端壁纸 <span class="hintline" style="display:inline">显示在 liuyun2026.github.io 首页与各页面</span></div>
      <div class="theme-preview"><img id="prev-guest" alt="访客端壁纸预览"></div>
      <div class="theme-actions">
        <button data-side="guest" data-act="upload">上传新壁纸</button>
        <button data-side="guest" data-act="reset">恢复默认</button>
      </div>
    </section>

    <section class="adm-panel theme-card">
      <div class="theme-name">管理端壁纸 <span class="hintline" style="display:inline">显示在 /admin/ 欢迎页、编辑器与本页</span></div>
      <div class="theme-preview"><img id="prev-admin" alt="管理端壁纸预览"></div>
      <div class="theme-actions">
        <button data-side="admin" data-act="upload">上传新壁纸</button>
        <button data-side="admin" data-act="reset">恢复默认</button>
      </div>
    </section>
  </div>

  <div class="theme-foot">
    <div class="adm-msg" id="msg"></div>
    <button class="adm-save" id="saveBtn">保存并发布</button>
  </div>
</main>
</div>

<script>
(function () {
  "use strict";

  var OWNER = "Liuyun2026", REPO = "liuyun2026.github.io", BRANCH = "main";
  var TOKEN_KEY = "gh_admin_token";
  var DEFAULT_WALLPAPER = "/assets/img/wallpaper.jpg";

  var theme = { guest: DEFAULT_WALLPAPER, admin: DEFAULT_WALLPAPER };
  var dirty = false;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function msg(text, kind) {
    var m = $("msg");
    if (!m) return;
    m.textContent = text || "";
    m.className = "adm-msg" + (kind ? " " + kind : "");
  }
  function token() { return localStorage.getItem(TOKEN_KEY) || ""; }

  function markDirty() {
    dirty = true;
    applyLocal();
  }

  /* 改动立即反映到本页背景，所见即所得 */
  function applyLocal() {
    var bg = document.querySelector(".bg");
    if (bg) bg.style.backgroundImage = 'url("' + theme.admin + '")';
  }

  function refreshPreview(side) {
    $("prev-" + side).src = theme[side];
  }

  /* ---------- 启动 ---------- */
  function boot() {
    if (token()) {
      $("status").textContent = "已连接";
      $("status").classList.add("on");
      $("tokenRow").style.display = "none";
    }
    fetch("/content/theme.json?t=" + Date.now()).then(function (r) {
      if (!r.ok) throw new Error("theme");
      return r.json();
    }).then(function (t) {
      theme.guest = t.guest || DEFAULT_WALLPAPER;
      theme.admin = t.admin || DEFAULT_WALLPAPER;
      refreshPreview("guest");
      refreshPreview("admin");
      applyLocal();
    }).catch(function () {
      refreshPreview("guest");
      refreshPreview("admin");
      applyLocal();
    });
  }

  /* ---------- 上传 ----------
   * 每次上传为新文件（assets/img/wallpaper-{端}-{时间戳}.jpg），
   * 由 theme.json 指向最新一张，旧图保留在仓库里可随时回退
   */
  function b64FromBuf(buf) {
    var bytes = new Uint8Array(buf), bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function extOf(name) {
    var m = String(name).toLowerCase().match(/\.(png|jpe?g|webp|gif|avif)$/);
    return m ? m[1].replace("jpeg", "jpg") : "jpg";
  }

  function uploadWallpaper(side, file) {
    var tk = token();
    if (!tk) { msg("请先填入令牌并连接", "err"); return; }
    if (file.size > 20 * 1024 * 1024) { msg("图片超过 20MB，请压缩后再传", "err"); return; }

    msg("上传壁纸中…");
    var rel = "assets/img/wallpaper-" + side + "-" + Date.now() + "." + extOf(file.name);
    var api = "https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/" + rel;

    file.arrayBuffer().then(function (buf) {
      return fetch(api, {
        method: "PUT",
        headers: {
          "Authorization": "Bearer " + tk,
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: "上传壁纸（" + side + "）：" + file.name,
          content: b64FromBuf(buf),
          branch: BRANCH
        })
      });
    }).then(function (r) {
      if (!r.ok) return r.text().then(function () { throw new Error("上传失败 " + r.status); });
      theme[side] = "/" + rel;
      refreshPreview(side);
      markDirty();
      msg("已上传，点「保存并发布」后生效", "ok");
    }).catch(function (e) { msg(e.message, "err"); });
  }

  /* ---------- 事件 ---------- */
  document.querySelector(".theme-grid").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-side]");
    if (!btn) return;
    var side = btn.getAttribute("data-side");
    var act = btn.getAttribute("data-act");

    if (act === "reset") {
      theme[side] = DEFAULT_WALLPAPER;
      refreshPreview(side);
      markDirty();
      msg("已切回默认壁纸，记得点保存", "ok");
      return;
    }

    if (act === "upload") {
      var inp = document.createElement("input");
      inp.type = "file";
      inp.accept = "image/*";
      inp.onchange = function () {
        if (inp.files.length) uploadWallpaper(side, inp.files[0]);
      };
      inp.click();
    }
  });

  $("tokenSave").addEventListener("click", function () {
    var v = $("tokenInput").value.trim();
    if (!v) return;
    localStorage.setItem(TOKEN_KEY, v);
    $("tokenInput").value = "";
    $("tokenRow").style.display = "none";
    $("status").textContent = "已连接";
    $("status").classList.add("on");
    msg("已保存令牌到本机浏览器", "ok");
  });

  /* ---------- 保存：只提交 theme.json 一个文件 ---------- */
  $("saveBtn").addEventListener("click", async function () {
    var tk = token();
    if (!tk) { msg("请先填入令牌并连接", "err"); return; }

    var btn = this;
    btn.disabled = true;
    msg("提交中…");

    var api = "https://api.github.com/repos/" + OWNER + "/" + REPO;
    var H = { "Authorization": "Bearer " + tk, "Accept": "application/vnd.github+json" };
    var HJ = { "Authorization": "Bearer " + tk, "Accept": "application/vnd.github+json", "Content-Type": "application/json" };

    try {
      var head = await fetch(api + "/git/ref/heads/" + BRANCH, { headers: H }).then(function (r) {
        if (r.status === 401) throw new Error("令牌无效或已过期");
        if (r.status === 404) throw new Error("找不到仓库或分支");
        return r.json();
      });
      var headSha = head.object.sha;

      var commit = await fetch(api + "/git/commits/" + headSha, { headers: H }).then(function (r) { return r.json(); });

      var blob = await fetch(api + "/git/blobs", {
        method: "POST", headers: HJ,
        body: JSON.stringify({ content: JSON.stringify(theme, null, 2) + "\n", encoding: "utf-8" })
      }).then(function (r) {
        if (!r.ok) throw new Error("写入文件失败");
        return r.json();
      });

      var newTree = await fetch(api + "/git/trees", {
        method: "POST", headers: HJ,
        body: JSON.stringify({
          base_tree: commit.tree.sha,
          tree: [{ path: "content/theme.json", mode: "100644", type: "blob", sha: blob.sha }]
        })
      }).then(function (r) { return r.json(); });

      var newCommit = await fetch(api + "/git/commits", {
        method: "POST", headers: HJ,
        body: JSON.stringify({
          message: "壁纸更新：" + new Date().toISOString().slice(0, 16).replace("T", " "),
          tree: newTree.sha,
          parents: [headSha]
        })
      }).then(function (r) { return r.json(); });

      await fetch(api + "/git/refs/heads/" + BRANCH, {
        method: "PATCH", headers: HJ,
        body: JSON.stringify({ sha: newCommit.sha })
      }).then(function (r) {
        if (!r.ok) throw new Error("更新分支失败");
        return r.json();
      });

      dirty = false;
      msg("已提交，刷新页面即可看到新壁纸", "ok");
    } catch (e) {
      msg(e.message, "err");
    }

    btn.disabled = false;
  });

  window.addEventListener("beforeunload", function (e) {
    if (dirty) { e.preventDefault(); e.returnValue = ""; }
  });

  boot();
})();
</script>
</body>
</html>
