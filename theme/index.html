<script>
/* 首屏判定：管理端主页播开场动画时，第一次绘制前就藏好顶栏、预置卡片状态，
   并显示静态首屏层（满屏底色 + 「你好」）。
   时间轴由 admin-app.js 等版本自检完成后接管，避免自检重载导致重播一次。
   版本自检触发的重载会带 v= 参数，此轮不再重播「你好」的入场淡入。
   本脚本位于 head，document.body 尚不存在，标记只加在 documentElement 上。 */
(function () {
  try {
    /* 玻璃档位在首次绘制前定下来：三个管理端页面各自加载，
       靠本机记忆保持一致，不必等 theme.json */
    var gl = localStorage.getItem("glass-admin");
    if (gl === "clear") document.documentElement.classList.add("glass-clear");

    var p = location.pathname.replace(/\/+$/, "") || "/";
    if (/(^|[?&])v=[0-9]{12}(&|$)/.test(location.search)) {
      document.documentElement.classList.add("ver-reload");
    }
    if (p !== "/admin") return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    document.documentElement.classList.add("intro-on", "intro-pending");

    /* 兜底：脚本异常导致时间轴始终没启动时放出页面，避免长时间锁死 */
    window.setTimeout(function () {
      var de = document.documentElement;
      if (de.classList.contains("intro-pending") && !document.querySelector(".jelly.is-intro")) {
        de.classList.remove("intro-pending", "intro-on");
      }
    }, 8000);
  } catch (e) {}
})();
</script>
<script src="/assets/js/pageflow.js?v=202611080836"></script>
<script src="/assets/js/bg.js?v=202611080836"></script>
<script>window.__BUILD__="202611080836";</script>
<script src="/assets/js/vercheck.js?v=202611080836"></script>
</head>
<body>

<div class="bg" aria-hidden="true"></div>

<script>
/* 首屏壁纸直接用上次记住的地址。等 theme.json 回来再设的话，
   用户会先看到默认图，再看着它换成自己那张。地址由 admin-app.js 读到配置后写入 */
(function () {
  try {
    var u = localStorage.getItem("bg-admin");
    var bg = document.querySelector(".bg");
    if (u && bg) bg.style.backgroundImage = 'url("' + u + '")';
  } catch (e) {}
})();
</script>

<!-- 开场静态首屏：HTML 解析到即出画面，不依赖内容加载。
     时间轴由 admin-app.js 在版本自检完成后接管，不重播「你好」。 -->
<div class="intro-boot" id="introBoot" aria-hidden="true"></div>
<div class="intro-layer on" id="introLayer" aria-hidden="true">
  <div class="intro-hello show"><span>你</span><span>好</span></div>
  <div class="intro-welcome">欢迎来到<span class="hl">流雲</span>的创客空间</div>
</div>

<!-- 滚动层：顶栏与视图都放在这里，滚动发生在本层内部。
