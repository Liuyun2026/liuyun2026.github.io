<script>
/* 玻璃档位与访客端同一套：首帧前套用本机记住的档位，手册页的玻璃面板才不会用错材质 */
try { if (localStorage.getItem("glass-guest") === "clear") document.documentElement.classList.add("glass-clear"); } catch (e) {}
</script>
<link rel="stylesheet" href="/assets/css/style.css?v=202611080841">
<link rel="stylesheet" href="/assets/css/admin.css?v=202611080841">
<style>
  /* 手册页不放整条顶栏，只留一个返回键：固定在左上角，玻璃参数与顶栏同一套，
     跟着玻璃档位走。body 用 clip 而不是 hidden，避免多出一个不滚动的滚动容器 */
  body { overflow-x: clip; }
  .doc-back {
    position: fixed; left: 20px; top: 16px; z-index: 60;
    display: inline-flex; align-items: center;
    font: inherit; font-size: 13px; line-height: 1;
    padding: 9px 15px; border-radius: 999px;
    color: var(--fg-2); cursor: pointer;
    background: var(--g-nav-bg);
    border: 1px solid var(--g-nav-edge);
    -webkit-backdrop-filter: blur(var(--g-nav-blur)) saturate(var(--g-nav-sat));
    backdrop-filter: blur(var(--g-nav-blur)) saturate(var(--g-nav-sat));
    box-shadow: var(--g-nav-sh);
    transition: color .2s, border-color .2s;
  }
  .doc-back:hover { color: #fff; border-color: var(--edge-hi); }

  /* 正文底板：与主卡同一套底色与描边，但**不挂 backdrop-filter**——
     这是几千像素高的长文档，实时模糊一整块不划算；壁纸本身已经够软，
     少这层模糊看不出来。底下再垫一层半透明深色，保证透明档下文字也压得住 */
  .doc-wrap {
    max-width: 860px; margin: 64px auto 56px;
    padding: 38px 34px 46px;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(7, 9, 16, .46), rgba(7, 9, 16, .54)), var(--g-jelly-bg);
    border: 1px solid var(--g-jelly-edge);
    box-shadow: var(--g-sh);
  }

  .doc-prose { max-width: none; }
  .doc-prose h1 {
    font-size: 26px; margin: 10px 0 22px; letter-spacing: -.02em;
  }
  .doc-prose h2 {
    font-size: 19px; margin: 40px 0 16px; padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,.1);
    padding-left: 0;
  }
  .doc-prose h2::before { display: none; }
  .doc-prose h3 { font-size: 15px; margin: 26px 0 10px; color: var(--accent); }
  .doc-prose p { margin: 0 0 15px; font-size: 14px; line-height: 1.85; color: rgba(228,236,244,.86); }
  .doc-prose ul, .doc-prose ol { margin: 0 0 16px; padding-left: 22px; font-size: 14px; line-height: 1.85; color: rgba(228,236,244,.86); }
  .doc-prose li { margin: 6px 0; }
  .doc-prose li::marker { color: var(--accent); }
  .doc-prose hr { border: 0; border-top: 1px solid rgba(255,255,255,.1); margin: 34px 0; }
  .doc-prose strong { color: #fff; }
  .doc-prose table {
    width: 100%; border-collapse: collapse; margin: 16px 0 22px;
    font-size: 13px; border-radius: 10px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.12);
  }
  .doc-prose th, .doc-prose td {
    padding: 9px 13px; text-align: left; vertical-align: top;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .doc-prose th {
    background: rgba(255,255,255,.05); color: var(--fg-2);
    font-weight: 600; font-size: 12.5px;
  }
  .doc-prose tr:last-child td { border-bottom: 0; }
  .doc-prose code {
    font-family: var(--mono); font-size: .88em;
    background: rgba(255,255,255,.08); padding: 2px 6px; border-radius: 6px; color: #BBD5FF;
  }
  .doc-prose pre {
    margin: 16px 0; padding: 16px 18px; border-radius: 10px;
    background: rgba(6,9,14,.72); border: 1px solid rgba(255,255,255,.08);
    overflow-x: auto;
  }
  .doc-prose pre code { background: none; padding: 0; color: rgba(226,236,246,.92); font-size: 12.8px; line-height: 1.7; }
  .doc-prose blockquote {
    margin: 18px 0; padding: 14px 18px; border-radius: 10px;
    background: rgba(127,178,255,.08); border-left: 3px solid rgba(127,178,255,.55);
    color: var(--fg-2); font-size: 13.5px;
  }
  .doc-prose blockquote p { margin: 0; font-size: 13.5px; color: var(--fg-2); }
  .doc-prose a { color: var(--accent); }

  @media (max-width: 680px) {
    .doc-wrap { padding-left: 20px; padding-right: 20px; }
    .doc-prose h1 { font-size: 21px; }
    .doc-prose h2 { font-size: 17px; }
    .doc-prose table { font-size: 12px; }
    .doc-prose th, .doc-prose td { padding: 7px 10px; }
  }

<body>

<div class="bg" aria-hidden="true"></div>

<script>
/* 手册页借一张壁纸：与访客端同一张（本机记住的那张，没记过用默认图） */
(function () {
  try {
    window.__bgPaint(localStorage.getItem("bg-guest") || "/assets/img/wallpaper.jpg");
  } catch (e) {}
})();
</script>

<button type="button" class="doc-back" id="docBack">← 返回</button>

<script>
/* 哪来的回哪：同源来路才回退，否则（直接粘地址打开）回首页，别把人带出站 */
(function () {
  var btn = document.getElementById("docBack");
  if (!btn) return;
  btn.addEventListener("click", function () {
    var same = false;
    try { same = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) {}
    if (same && history.length > 1) history.back();
    else location.href = "/";
  });
})();
</script>

<main class="doc-wrap">
  <article class="prose doc-prose" id="doc">
    <p style="color:var(--fg-3)">加载中…</p>
  </article>
</main>

<script>
(function () {
  "use strict";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* 行内标记：先把行内代码抽成占位符，处理完其它语法再还原，
     避免代码里的 ** 或方括号被误解析 */
  function inline(t) {
    var codes = [];
    var s = String(t).replace(/`([^`]+)`/g, function (_, c) {
      codes.push(c);
      return "\u0001" + (codes.length - 1) + "\u0001";
    });
    s = esc(s)
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      /* 转义后尖括号变成 &lt; &gt;，自动链接要按转义后的形态匹配 */
      .replace(/&lt;(https?:\/\/[^\s&]+)&gt;/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\u0001(\d+)\u0001/g, function (_, n) {
      return "<code>" + esc(codes[+n]) + "</code>";
    });
    return s;
  }

  function splitRow(line) {
    var s = line.trim().replace(/^\|/, "").replace(/\|$/, "");
    var cells = [], cur = "";
    for (var i = 0; i < s.length; i++) {
      var ch = s[i];
      if (ch === "\\" && s[i + 1] === "|") { cur += "|"; i++; continue; }
      if (ch === "|") { cells.push(cur.trim()); cur = ""; continue; }
      cur += ch;
    }
    cells.push(cur.trim());
    return cells;
  }

  function renderMd(text) {
    var lines = text.replace(/\r\n/g, "\n").split("\n");
    var out = [], i = 0;

    function isTableSep(s) {
      return /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(s) && s.indexOf("-") >= 0;
    }

    while (i < lines.length) {
      var line = lines[i];

      /* 代码块 */
      if (/^\s*```/.test(line)) {
        var buf = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
        continue;
      }

      /* 表格 */
      if (/^\s*\|/.test(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        var head = splitRow(line);
        i += 2;
        var body = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) { body.push(splitRow(lines[i])); i++; }
        var h = "<table><thead><tr>" + head.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead><tbody>";
        var b = body.map(function (r) {
          return "<tr>" + r.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>";
        }).join("");
        out.push(h + b + "</tbody></table>");
        continue;
      }

      /* 标题 */
      var m = line.match(/^(#{1,3})\s+(.*)$/);
      if (m) {
        var lv = m[1].length;
        out.push("<h" + lv + ">" + inline(m[2]) + "</h" + lv + ">");
        i++;
        continue;
      }

      /* 分隔线 */
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { out.push("<hr>"); i++; continue; }

      /* 引用 */
      if (/^\s*>\s?/.test(line)) {
        var q = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
          q.push(lines[i].replace(/^\s*>\s?/, ""));
          i++;
        }
        out.push("<blockquote><p>" + inline(q.join(" ")) + "</p></blockquote>");
        continue;
      }

      /* 有序列表 */
      if (/^\s*\d+\.\s+/.test(line)) {
        var ol = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          ol.push(lines[i].replace(/^\s*\d+\.\s+/, ""));
          i++;
        }
        out.push("<ol>" + ol.map(function (x) { return "<li>" + inline(x) + "</li>"; }).join("") + "</ol>");
        continue;
      }

      /* 无序列表 */
      if (/^\s*[-*]\s+/.test(line)) {
        var ul = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          ul.push(lines[i].replace(/^\s*[-*]\s+/, ""));
          i++;
        }
        out.push("<ul>" + ul.map(function (x) { return "<li>" + inline(x) + "</li>"; }).join("") + "</ul>");
        continue;
      }

      /* 缩进代码块（四空格，用于排版示例） */
      if (/^    \S/.test(line)) {
        var cbuf = [];
        while (i < lines.length && (/^    /.test(lines[i]) || lines[i].trim() === "")) {
          if (lines[i].trim() === "" && !(i + 1 < lines.length && /^    /.test(lines[i + 1]))) break;
          cbuf.push(lines[i].replace(/^    /, ""));
          i++;
        }
        out.push("<pre><code>" + esc(cbuf.join("\n")) + "</code></pre>");
        continue;
      }

      /* 空行 */
      if (!line.trim()) { i++; continue; }

      /* 段落：收集到空行为止 */
      var para = [];
      while (i < lines.length && lines[i].trim() &&
             !/^(#{1,3}\s|\s*\||\s*[-*]\s|\s*\d+\.\s|\s*>|\s*```|-{3,})/.test(lines[i])) {
        para.push(lines[i]);
        i++;
      }
      if (para.length) out.push("<p>" + inline(para.join(" ")) + "</p>");
    }
    return out.join("\n");
  }

  fetch("/manual/manual.md", { cache: "no-cache" })
    .then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    })
    .then(function (text) {
      document.getElementById("doc").innerHTML = renderMd(text);
    })
    .catch(function () {
      document.getElementById("doc").innerHTML = '<p style="color:#F2757A">手册加载失败</p>';
    });
})();
</script>
</body>
</html>
